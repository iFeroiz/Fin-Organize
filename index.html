<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
Entrar com o Google

<!-- Modal Adicionar -->
<div id="add-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
<div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
<div class="flex justify-between items-center"><h3 class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-indigo-500"></i>Novo Lançamento</h3><button onclick="toggleModal('add-modal',false)" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>

<div><label class="block text-xs font-medium text-slate-400 mb-1">Tipo</label><select id="form-type" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"><option value="expense">Despesa</option><option value="income">Receita</option></select></div>

<!-- Modal Editar -->
<div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
<div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
<div class="flex justify-between items-center"><h3 class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="edit-3" class="w-5 h-5 text-indigo-500"></i>Editar Lançamento</h3><button onclick="toggleModal('edit-modal',false)" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
<form id="edit-transaction-form" onsubmit="handleEditSubmit(event)" class="space-y-3">
<input type="hidden" id="edit-id">
<input type="hidden" id="edit-cycle-key">
<div><label class="block text-xs font-medium text-slate-400 mb-1">Descrição</label><input type="text" id="edit-desc" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>
<div><label class="block text-xs font-medium text-slate-400 mb-1">Valor (R$)</label><input type="number" step="0.01" id="edit-value" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></div>

<div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 opacity-0 pointer-events-none flex items-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i><span id="toast-msg">Salvo!</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const currentYr = new Date().getFullYear();
const YEARS = [currentYr - 1, currentYr, currentYr + 1];

window.appState={
  currentTab: 'overview',
  selectedYear: currentYr,
  selectedMonth: new Date().getMonth(),
  transactions: {},
  gleycePhoto: null,
  guilhermePhoto: null
};

const ALLOWED_EMAILS = ["rstormer12@gmail.com", "gleyceellendama@gmail.com"];

const firebaseConfig = {
  apiKey: "AIzaSyDlXTIljVbzsYUMYb7VGDwBaYc_3S6UpxQ",
  authDomain: "fin-organize.firebaseapp.com",
  projectId: "fin-organize",
  storageBucket: "fin-organize.firebasestorage.app",
  messagingSenderId: "447694269555",
  appId: "1:447694269555:web:772742863554c787f9ce06",
  measurementId: "G-9M44KDM5J5"
};

let db=null, auth=null, chartInst=null, unsubscribeSnapshot=null;

const ySel = document.getElementById('year-select');
YEARS.forEach(y => {
  const opt = document.createElement('option');
  opt.value = y; opt.innerText = y;
  if(y === currentYr) opt.selected = true;
  ySel.appendChild(opt);
});

setInterval(()=>{const d=new Date(),t=document.getElementById('current-time');if(t)t.innerText=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;},1000);
window.showToast=m=>{const t=document.getElementById('toast');document.getElementById('toast-msg').innerText=m;t.classList.remove('opacity-0','pointer-events-none');t.classList.add('opacity-100');setTimeout(()=>t.classList.replace('opacity-100','opacity-0'),2500)};
window.toggleModal=(id,show)=>document.getElementById(id).classList.toggle('hidden',!show);

function getSeed(){
  let i={};
  YEARS.forEach(y => {
    i[y] = {};
    for(let m=0; m<12; m++) i[y][m]={gleyce:[],guilherme15:[],guilherme30:[]};
  });
  return i;
}

function ensureStructure(data){
  YEARS.forEach(y => {
    if(!data[y]) data[y] = {};
    for(let m=0; m<12; m++){
      if(!data[y][m]) data[y][m] = {gleyce:[],guilherme15:[],guilherme30:[]};
      if(!data[y][m].gleyce) data[y][m].gleyce = [];
      if(!data[y][m].guilherme15) data[y][m].guilherme15 = [];
      if(!data[y][m].guilherme30) data[y][m].guilherme30 = [];
    }
  });
  return data;
}

async function initSync(){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);

  onAuthStateChanged(auth, async (user) => {
    if (user && ALLOWED_EMAILS.includes(user.email.toLowerCase())) {
      toggleModal('login-modal', false);
      
      if (user.photoURL) {
        const profileKey = user.email.toLowerCase().includes('gleyce') ? 'gleycePhoto' : 'guilhermePhoto';
        try {
          const sharedDocRef = doc(db, 'financas_familia', 'dados_compartilhados');
          await setDoc(sharedDocRef, { [profileKey]: user.photoURL }, { merge: true });
        } catch(e){}
      }

      listenDB();
    } else {
      if (user) {
        showLoginError(`O e-mail ${user.email} não tem permissão de acesso.`);
        signOut(auth);
      }
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      toggleModal('login-modal', true);
      setSyncUI(false, "Não logado");
    }
  });
}

window.handleGoogleLogin = async () => {
  const provider = new GoogleAuthProvider();
  const btn = document.getElementById('google-btn');
  try {
    btn.disabled = true;
    document.getElementById('login-error').classList.add('hidden');
    await signInWithPopup(auth, provider);
  } catch (err) {
    showLoginError("Erro ao autenticar com o Google.");
  } finally {
    btn.disabled = false;
  }
};

window.handleLogout = () => {
  if (confirm("Deseja sair da sua conta Google no app?")) {
    signOut(auth);
  }
};

function showLoginError(msg) {
  const err = document.getElementById('login-error');
  err.innerText = msg;
  err.classList.remove('hidden');
}

function listenDB(){
  if(!db) return;
  const sharedDocRef = doc(db, 'financas_familia', 'dados_compartilhados');

  unsubscribeSnapshot = onSnapshot(sharedDocRef, (ds) => {
    if(ds.exists()){
      const data = ds.data();
      if (data.transactions) window.appState.transactions = ensureStructure(data.transactions);
      if (data.gleycePhoto) window.appState.gleycePhoto = data.gleycePhoto;
      if (data.guilhermePhoto) window.appState.guilhermePhoto = data.guilhermePhoto;
      setSyncUI(true);
      render();
    } else {
      const d = getSeed();
      window.appState.transactions = d;
      setDoc(sharedDocRef, { transactions: d, lastUpdated: new Date().toISOString() }).catch(()=>{});
      setSyncUI(true);
      render();
    }
  }, (err) => {
    setSyncUI(false, "Sem permissão no Firebase");
  });
}

function setSyncUI(on, r = "") {
  document.getElementById('sync-status').className = `w-2 h-2 rounded-full ${on ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`;
  document.getElementById('header-dot').className = `w-2.5 h-2.5 rounded-full ${on ? 'bg-emerald-500' : 'bg-amber-500'}`;
  document.getElementById('sync-label').innerText = on ? "Sincronizado" : (r || "Offline");

  const user = auth?.currentUser;
  const userInfoText = document.getElementById('user-info-text');

  if (on && user) {
    if (user.photoURL) {
      userInfoText.innerHTML = `
        <div class="flex items-center gap-1.5">
          <img src="${user.photoURL}" alt="Avatar" class="w-4 h-4 rounded-full border border-indigo-400 object-cover">
          <span class="truncate max-w-[85px]">${user.displayName || user.email}</span>
        </div>
      `;
    } else {
      userInfoText.innerText = user.email;
    }
  } else {
    userInfoText.innerText = "Faça Login";
  }
}

async function persist(){
  if(db && auth?.currentUser){
    try{
      const sharedDocRef = doc(db, 'financas_familia', 'dados_compartilhados');
      await setDoc(sharedDocRef, {transactions: window.appState.transactions, updatedAt: new Date().toISOString()}, {merge: true});
    }catch(e){}
  }
}

window.handleFormSubmit=async e=>{
  e.preventDefault();
  const c=document.getElementById('form-cycle').value;
  const t=document.getElementById('form-type').value;
  const desc=document.getElementById('form-desc').value;
  const v=parseFloat(document.getElementById('form-value').value);
  const isFixed=document.getElementById('form-is-fixed').checked;

  const yr = window.appState.selectedYear;
  const m = window.appState.selectedMonth;
  const groupKey = isFixed ? 'fixed_' + Date.now() : null;

  if(isFixed) {
    YEARS.forEach(y => {
      for(let month = 0; month < 12; month++) {
        if(!window.appState.transactions[y]) window.appState.transactions[y] = {};
        if(!window.appState.transactions[y][month]) window.appState.transactions[y][month] = {gleyce:[],guilherme15:[],guilherme30:[]};
        
        window.appState.transactions[y][month][c].push({
          id: 'tx_' + Date.now() + '_' + y + '_' + month,
          groupKey: groupKey,
          desc: desc,
          value: v,
          type: t,
          isFixed: true,
          paid: false
        });
      }
    });
    showToast('Conta fixa adicionada!');
  } else {
    if(!window.appState.transactions[yr][m]) window.appState.transactions[yr][m]={gleyce:[],guilherme15:[],guilherme30:[]};
    window.appState.transactions[yr][m][c].push({
      id: 'tx_' + Date.now(),
      desc: desc,
      value: v,
      type: t,
      isFixed: false,
      paid: false
    });
    showToast('Lançamento salvo!');
  }

  await persist();
  render();
  toggleModal('add-modal', false);
  document.getElementById('transaction-form').reset();
};

window.togglePaidStatus = async (c, id) => {
  const yr = window.appState.selectedYear;
  const m = window.appState.selectedMonth;
  const item = window.appState.transactions[yr]?.[m]?.[c]?.find(i => i.id === id);
  if (item) {
    item.paid = !item.paid;
    await persist();
    render();
    showToast(item.paid ? 'Conta Paga!' : 'Conta Pendente!');
  }
};

window.openEditModal = (c, id) => {
  const yr = window.appState.selectedYear;
  const m = window.appState.selectedMonth;
  const item = window.appState.transactions[yr]?.[m]?.[c]?.find(i => i.id === id);
  if (item) {
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-cycle-key').value = c;
    document.getElementById('edit-desc').value = item.desc;
    document.getElementById('edit-value').value = item.value;
    toggleModal('edit-modal', true);
  }
};

window.handleEditSubmit = async e => {
  e.preventDefault();
  const yr = window.appState.selectedYear;
  const m = window.appState.selectedMonth;
  const id = document.getElementById('edit-id').value;
  const c = document.getElementById('edit-cycle-key').value;
  const desc = document.getElementById('edit-desc').value;
  const val = parseFloat(document.getElementById('edit-value').value);

  const item = window.appState.transactions[yr]?.[m]?.[c]?.find(i => i.id === id);
  if (item) {
    item.desc = desc;
    item.value = val;
    await persist();
    render();
    toggleModal('edit-modal', false);
    showToast('Atualizado!');
  }
};

window.deleteTransaction=async(c,id)=>{
  const yr=window.appState.selectedYear;
  const m=window.appState.selectedMonth;
  if(window.appState.transactions[yr]?.[m]?.[c]){
    window.appState.transactions[yr][m][c]=window.appState.transactions[yr][m][c].filter(i=>i.id!==id);
    await persist();render();showToast('Excluído!');
  }
};

window.deleteFixedGroup=async(groupKey)=>{
  if(confirm("Deseja remover essa conta fixa de TODOS os anos e meses?")){
    YEARS.forEach(y => {
      for(let m=0; m<12; m++){
        if(window.appState.transactions[y]?.[m]){
          ['gleyce','guilherme15','guilherme30'].forEach(ck=>{
            window.appState.transactions[y][m][ck] = window.appState.transactions[y][m][ck].filter(i=>i.groupKey !== groupKey);
          });
        }
      }
    });
    await persist();render();showToast('Conta fixa removida de tudo!');
  }
};

window.switchTab=id=>{
  window.appState.currentTab=id;
  document.querySelectorAll('nav button').forEach(b=>b.classList.replace('text-indigo-400','text-slate-400'));
  document.getElementById(`nav-${id}`)?.classList.replace('text-slate-400','text-indigo-400');
  render();
};

document.getElementById('month-select').addEventListener('change',e=>{window.appState.selectedMonth=parseInt(e.target.value);render();});
document.getElementById('year-select').addEventListener('change',e=>{window.appState.selectedYear=parseInt(e.target.value);render();});
window.openAddModal=()=>toggleModal('add-modal',true);
window.openAddModalWithCycle=c=>{document.getElementById('form-cycle').value=c;openAddModal();};

function calcCycle(yr,m,c){
  const l=window.appState.transactions[yr]?.[m]?.[c]||[];
  let inc=0, expTotal=0, expPaid=0, expPending=0;
  l.forEach(i=>{
    if(i.type==='income') {
      inc+=i.value;
    } else {
      expTotal+=i.value;
      if(i.paid) expPaid+=i.value;
      else expPending+=i.value;
    }
  });
  return {
    income: inc,
    expenseTotal: expTotal,
    expensePaid: expPaid,
    expensePending: expPending,
    realBalance: inc - expPaid,
    projectedBalance: inc - expTotal,
    list: l
  };
}

function calcMonth(yr,m){
  const g=calcCycle(yr,m,'gleyce'), g15=calcCycle(yr,m,'guilherme15'), g30=calcCycle(yr,m,'guilherme30');
  const inc = g.income + g15.income + g30.income;
  const expPaid = g.expensePaid + g15.expensePaid + g30.expensePaid;
  const expPending = g.expensePending + g15.expensePending + g30.expensePending;
  const expTotal = g.expenseTotal + g15.expenseTotal + g30.expenseTotal;

  return {
    income: inc,
    expensePaid: expPaid,
    expensePending: expPending,
    expenseTotal: expTotal,
    realBalance: inc - expPaid,
    projectedBalance: inc - expTotal,
    gleyce: g,
    guilherme15: g15,
    guilherme30: g30
  };
}

function render(){
  document.getElementById('month-select').value=window.appState.selectedMonth;
  document.getElementById('year-select').value=window.appState.selectedYear;
  const c=document.getElementById('app-content');if(!c)return;c.innerHTML='';
  const tab=window.appState.currentTab,yr=window.appState.selectedYear,m=window.appState.selectedMonth;
  if(tab==='overview')renderOverview(c,yr,m);
  else if(tab==='list')renderList(c,yr,m);
  else if(tab==='fixed')renderFixed(c);
  else renderCycle(c,yr,m,tab);
  if(window.lucide)lucide.createIcons();
}

function renderCycle(c,yr,m,key){
  const tot=calcCycle(yr,m,key);
  const cfg={gleyce:['Gleyce (Dia 5)','Dia 5','user','bg-pink-500/10 text-pink-400 border-pink-500/20'],guilherme15:['Guilherme (Dia 15)','Dia 15','calendar','bg-blue-500/10 text-blue-400 border-blue-500/20'],guilherme30:['Guilherme (Dia 30)','Dia 30','calendar-check','bg-purple-500/10 text-purple-400 border-purple-500/20']}[key];

function renderFixed(c){
  let fixedMap = new Map();
  YEARS.forEach(y => {
    for(let m=0; m<12; m++){
      const monthData = window.appState.transactions[y]?.[m];
      if(monthData){
        ['gleyce','guilherme15','guilherme30'].forEach(ck => {
          (monthData[ck]||[]).forEach(item => {
            if(item.isFixed && item.groupKey && !fixedMap.has(item.groupKey)){
              fixedMap.set(item.groupKey, {...item, cycleName: ck==='gleyce'?'Gleyce (Dia 5)':ck==='guilherme15'?'Guilherme (15)':'Guilherme (30)'});
            }
          });
        });
      }
    }
  });

  const fixedList = Array.from(fixedMap.values());
  let h = `<div class="space-y-4"><div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-xl"><h2 class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="repeat" class="w-5 h-5 text-indigo-400"></i>Contas Fixas Recorrentes</h2><p class="text-xs text-slate-400 mt-1">Essas contas se repetem nos 24 meses do histórico.</p></div><div class="space-y-2">`;
  
  if(fixedList.length === 0) {
    h += `<div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-8 text-center text-slate-500 text-xs">Nenhuma conta fixa cadastrada.<br>Ao criar um lançamento, marque "Conta Fixa".</div>`;
  } else {
    fixedList.forEach(i => {
      const inc = i.type === 'income';
      h += `<div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between shadow"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl ${inc?'bg-emerald-500/20 text-emerald-400':'bg-indigo-500/20 text-indigo-400'} flex items-center justify-center"><i data-lucide="repeat" class="w-4 h-4"></i></div><div><h4 class="text-xs font-bold text-white">${i.desc}</h4><span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md">${i.cycleName}</span></div></div><div class="flex items-center gap-3"><span class="text-xs font-bold ${inc?'text-emerald-400':'text-slate-200'}">R$ ${i.value.toLocaleString('pt-BR',{minimumFractionDigits:2})} /mês</span><button onclick="deleteFixedGroup('${i.groupKey}')" title="Excluir de todos os meses" class="text-slate-500 hover:text-rose-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
    });
  }
  c.innerHTML = h + `</div></div>`;
}

}

function initChart(yr){
  const ctx=document.getElementById('annualChart');if(!ctx)return;
  const ms=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],ex=[],inc=[];
  for(let m=0;m<12;m++){const r=calcMonth(yr,m);ex.push(r.expensePaid);inc.push(r.income);}
  if(chartInst)chartInst.destroy();
  chartInst=new Chart(ctx,{type:'bar',data:{labels:ms,datasets:[{label:'Ganhos',data:inc,backgroundColor:'rgba(52, 211, 153, 0.6)',borderRadius:4},{label:'Gastos Pagos',data:ex,backgroundColor:'rgba(244, 63, 94, 0.6)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}}},scales:{x:{grid:{display:false},ticks:{color:'#64748b',font:{size:9}}},y:{grid:{color:'rgba(51, 65, 85, 0.3)'},ticks:{color:'#64748b',font:{size:9}}}}}});
}
